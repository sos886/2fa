<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA 驗證碼生成器</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #171a2b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #7b839b; user-select: none;
        }
        .container { text-align: center; width: 100%; max-width: 400px; padding: 20px; }
        .title { font-size: 16px; margin-bottom: 24px; letter-spacing: 1px; }
        .code-box {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; padding: 24px 0; margin-bottom: 16px;
            cursor: pointer; transition: background-color 0.2s, border-color 0.2s;
        }
        .code-box:hover { background-color: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.2); }
        .code-text { font-family: "Times New Roman", Georgia, serif; font-size: 48px; color: #ffffff; letter-spacing: 2px; font-weight: 500; }
        .countdown { font-size: 13px; margin-bottom: 8px; }
        .hint { font-size: 11px; color: #4b5268; }
        .toast { position: fixed; bottom: 30px; background: rgba(255, 255, 255, 0.9); color: #171a2b; padding: 8px 16px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="title" id="title-text">當前驗證碼為</div>
        <div class="code-box" onclick="copyCode()">
            <div class="code-text" id="auth-code">------</div>
        </div>
        <div class="countdown" id="countdown-text">倒計時 --s</div>
        <div class="hint">點擊驗證碼會自動複製到剪貼簿</div>
    </div>
    <div class="toast" id="toast">已複製到剪貼簿</div>

    <script>
        // ======= 內建輕量化 2FA 核心演算法 (完全不依賴外部網站) =======
        const TOTP = {
            base32tohex: function(b32) {
                const b32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
                let bits = "", hex = "";
                b32 = b32.replace(/=+$/, "");
                for (let i = 0; i < b32.length; i++) {
                    let val = b32chars.indexOf(b32.charAt(i).toUpperCase());
                    if (val === -1) throw new Error("Invalid base32 character");
                    bits += val.toString(2).padStart(5, '0');
                }
                for (let i = 0; i + 4 <= bits.length; i += 4) {
                    hex += parseInt(bits.substr(i, 4), 2).toString(16);
                }
                return hex;
            },
            dec2hex: function(s) { return (s < 15.5 ? "0" : "") + Math.round(s).toString(16); },
            hex2dec: function(s) { return parseInt(s, 16); },
            leftpad: function(str, len, pad) { return len + 1 >= str.length ? (new Array(len + 1 - str.length).join(pad) + str) : str; },
            
            // 內建簡易 HMAC-SHA1 實作
            sha1: function(str) {
                let d = [], f = [function(b,c,d){return b&c|~b&d;},function(b,c,d){return b^c^d;},function(b,c,d){return b&c|b&d|c&d;},function(b,c,d){return b^c^d;}], g = [1518500249,1859775393,-1894007588,-899497514], h = [1732584193,-271733879,-1732584194,271733878,-1009589776];
                if (typeof str === "string") {
                    let s = unescape(encodeURIComponent(str)), h = [];
                    for (let i = 0; i < s.length; i++) h[i >> 2] |= s.charCodeAt(i) << (24 - (i % 4) * 8);
                    str = h;
                }
                for (let i = 0; i < str.length; i++) d[i] = str[i];
                let blen = d.length * 32;
                d[blen >> 5] |= 128 << (24 - blen % 32); d[((blen + 64 >> 9) << 4) + 15] = blen;
                for (let i = 0; i < d.length; i += 16) {
                    let w = [], a = h[0], b = h[1], c = h[2], d_val = h[3], e = h[4];
                    for (let j = 0; j < 80; j++) {
                        w[j] = (j < 16) ? d[i + j] : (w[j-3] ^ w[j-8] ^ w[j-14] ^ w[j-16]) << 1 | (w[j-3] ^ w[j-8] ^ w[j-14] ^ w[j-16]) >>> 31;
                        let t = (a << 5 | a >>> 27) + f[Math.floor(j/20)](b,c,d_val) + e + g[Math.floor(j/20)] + (w[j] >>> 0);
                        e = d_val; d_val = c; c = b << 30 | b >>> 2; b = a; a = t;
                    }
                    h[0] += a; h[1] += b; h[2] += c; h[3] += d_val; h[4] += e;
                }
                return h;
            },
            hmac_sha1: function(keyHex, messageHex) {
                let key = [], msg = [];
                for(let i=0; i<keyHex.length; i+=8) key.push(parseInt(keyHex.substr(i,8), 16));
                for(let i=0; i<messageHex.length; i+=8) msg.push(parseInt(messageHex.substr(i,8), 16));
                if(key.length > 16) key = this.sha1(key);
                let ipad = [], opad = [];
                for(let i=0; i<16; i++) { ipad[i] = key[i] ^ 909522486; opad[i] = key[i] ^ 1549556828; }
                let hash = this.sha1(ipad.concat(msg));
                return this.sha1(opad.concat(hash));
            },
            
            getOTP: function(secret) {
                try {
                    let key = this.base32tohex(secret);
                    let epoch = Math.floor(new Date().getTime() / 1000);
                    let time = this.leftpad(Math.floor(epoch / 30).toString(16), 16, "0");
                    let hmac = this.hmac_sha1(key, time);
                    let hmacHex = hmac.map(h => this.leftpad((h >>> 0).toString(16), 8, "0")).join('');
                    let offset = this.hex2dec(hmacHex.substring(hmacHex.length - 1));
                    let otp = (this.hex2dec(hmacHex.substr(offset * 2, 8)) & this.hex2dec("7fffffff")) + "";
                    otp = otp.substr(otp.length - 6, 6).padStart(6, '0');
                    return otp;
                } catch (e) {
                    return "ERROR";
                }
            }
        };

        // ======= 網頁控制邏輯 =======
        function getSecret() {
            let secret = "";
            if (window.location.hash) {
                secret = window.location.hash.substring(1);
            } else if (window.location.search) {
                const urlParams = new URLSearchParams(window.location.search);
                secret = urlParams.get('secret') || window.location.search.substring(1);
            }
            return secret.toUpperCase().replace(/[\s\uFEFF\xA0]+/g, '');
        }

        let SECRET = getSecret();

        function updateTOTP() {
            if (!SECRET) {
                document.getElementById('auth-code').innerText = "無密鑰";
                document.getElementById('title-text').innerText = "請在網址後加上您的密鑰";
                return;
            }
            document.getElementById('title-text').innerText = "當前驗證碼為";
            const token = TOTP.getOTP(SECRET);
            if (token === "ERROR") {
                document.getElementById('auth-code').innerText = "ERROR";
                document.getElementById('title-text').innerText = "密鑰格式不正確";
            } else {
                document.getElementById('auth-code').innerText = token.slice(0, 3) + " " + token.slice(3);
            }
        }

        function updateCountdown() {
            const epoch = Math.round(new Date().getTime() / 1000);
            const remaining = 30 - (epoch % 30);
            document.getElementById('countdown-text').innerText = "倒計時 " + remaining + "s";
            if (remaining === 30 || document.getElementById('auth-code').innerText === "------" || document.getElementById('auth-code').innerText === "無密鑰") {
                updateTOTP();
            }
        }

        function copyCode() {
            const code = document.getElementById('auth-code').innerText.replace(" ", "");
            if (code === "------" || code === "ERROR" || code === "無密鑰") return;
            navigator.clipboard.writeText(code).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 1500);
            });
        }

        window.addEventListener('hashchange', () => {
            SECRET = getSecret();
            updateTOTP();
        });

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
