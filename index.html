<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA 驗證碼生成器</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #171a2b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #7b839b; user-select: none;
        }
        .container { text-align: center; width: 100%; max-width: 400px; padding: 20px; }
        .title { font-size: 16px; margin-bottom: 24px; letter-spacing: 1px; }
        .code-box {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; padding: 24px 0; margin-bottom: 16px;
            cursor: pointer; transition: background-color 0.2s, border-color 0.2s;
        }
        .code-box:hover { background-color: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.2); }
        .code-text { font-family: "Times New Roman", Georgia, serif; font-size: 48px; color: #ffffff; letter-spacing: 2px; font-weight: 500; }
        .countdown { font-size: 13px; margin-bottom: 8px; }
        .hint { font-size: 11px; color: #4b5268; }
        .toast { position: fixed; bottom: 30px; background: rgba(255, 255, 255, 0.9); color: #171a2b; padding: 8px 16px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="title" id="title-text">當前驗證碼為</div>
        <div class="code-box" onclick="copyCode()">
            <div class="code-text" id="auth-code">------</div>
        </div>
        <div class="countdown" id="countdown-text">倒計時 --s</div>
        <div class="hint">點擊驗證碼會自動複製到剪貼簿</div>
    </div>
    <div class="toast" id="toast">已複製到剪貼簿</div>

    <script>
        // ======= 完美修正版 2FA 核心演算法 (完全不依賴外部網站，標準HMAC-SHA1) =======
        const TOTP = {
            base32tohex: function(b32) {
                const b32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
                let bits = "", hex = "";
                b32 = b32.replace(/=+$/, "");
                for (let i = 0; i < b32.length; i++) {
                    let val = b32chars.indexOf(b32.charAt(i).toUpperCase());
                    if (val === -1) throw new Error("Invalid base32 character");
                    bits += val.toString(2).padStart(5, '0');
                }
                for (let i = 0; i + 4 <= bits.length; i += 4) {
                    hex += parseInt(bits.substr(i, 4), 2).toString(16);
                }
                return hex;
            },
            
            // 将十六进制字符串转为 Uint8Array 字节数组
            hexToBytes: function(hex) {
                let bytes = [];
                for (let c = 0; c < hex.length; c += 2) {
                    bytes.push(parseInt(hex.substr(c, 2), 16));
                }
                return bytes;
            },

            // 纯原生字节级标准 HMAC-SHA1 算法
            hmac_sha1: function(keyBytes, msgBytes) {
                if (keyBytes.length > 64) {
                    keyBytes = this.sha1_raw(keyBytes);
                }
                while (keyBytes.length < 64) {
                    keyBytes.push(0);
                }

                let ipad = new Array(64), opad = new Array(64);
                for (let i = 0; i < 64; i++) {
                    ipad[i] = keyBytes[i] ^ 0x36;
                    opad[i] = keyBytes[i] ^ 0x5C;
                }

                let innerHash = this.sha1_raw(ipad.concat(msgBytes));
                return this.sha1_raw(opad.concat(innerHash));
            },

            sha1_raw: function(bytes) {
                let words = [];
                for (let i = 0; i < bytes.length; i++) {
                    words[i >> 2] |= bytes[i] << (24 - (i % 4) * 8);
                }
                
                let blen = bytes.length * 8;
                words[blen >> 5] |= 128 << (24 - blen % 32);
                words[((blen + 64 >> 9) << 4) + 15] = blen;

                let h0 = 1732584193, h1 = -271733879, h2 = -1732584194, h3 = 271733878, h4 = -1009589776;
                let w = new Array(80);

                for (let i = 0; i < words.length; i += 16) {
                    let a = h0, b = h1, c = h2, d = h3, e = h4;
                    for (let j = 0; j < 80; j++) {
                        if (j < 16) {
                            w[j] = words[i + j] || 0;
                        } else {
                            let num = w[j-3] ^ w[j-8] ^ w[j-14] ^ w[j-16];
                            w[j] = (num << 1) | (num >>> 31);
                        }
                        
                        let f, k;
                        if (j < 20) {
                            f = (b & c) | (~b & d); k = 1518500249;
                        } else if (j < 40) {
                            f = b ^ c ^ d; k = 1859775393;
                        } else if (j < 60) {
                            f = (b & c) | (b & d) | (c & d); k = -1894007588;
                        } else {
                            f = b ^ c ^ d; k = -899497514;
                        }

                        let t = ((a << 5) | (a >>> 27)) + f + e + k + (w[j] >>> 0);
                        e = d; d = c; c = (b << 30) | (b >>> 2); b = a; a = t;
                    }
                    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
                }

                let result = [];
                let hArray = [h0, h1, h2, h3, h4];
                for (let i = 0; i < 5; i++) {
                    for (let j = 3; j >= 0; j--) {
                        result.push((hArray[i] >> (j * 8)) & 0xFF);
                    }
                }
                return result;
            },
            
            getOTP: function(secret) {
                try {
                    let keyHex = this.base32tohex(secret);
                    let keyBytes = this.hexToBytes(keyHex);
                    let epoch = Math.floor(new Date().getTime() / 1000);
                    let timeHex = Math.floor(epoch / 30).toString(16).padStart(16, "0");
                    let msgBytes = this.hexToBytes(timeHex);
                    
                    let hmacBytes = this.hmac_sha1(keyBytes, msgBytes);
                    let offset = hmacBytes[hmacBytes.length - 1] & 0xf;
                    
                    let otpVal = ((hmacBytes[offset] & 0x7f) << 24) |
                                 ((hmacBytes[offset + 1] & 0xff) << 16) |
                                 ((hmacBytes[offset + 2] & 0xff) << 8) |
                                 (hmacBytes[offset + 3] & 0xff);
                                 
                    let otp = (otpVal % 1000000).toString().padStart(6, '0');
                    return otp;
                } catch (e) {
                    return "ERROR";
                }
            }
        };

        // ======= 網頁控制邏輯 =======
        function getSecret() {
            let secret = "";
            if (window.location.hash) {
                secret = window.location.hash.substring(1);
            } else if (window.location.search) {
                const urlParams = new URLSearchParams(window.location.search);
                secret = urlParams.get('secret') || window.location.search.substring(1);
            }
            return secret.toUpperCase().replace(/[\s\uFEFF\xA0]+/g, '');
        }

        let SECRET = getSecret();

        function updateTOTP() {
            if (!SECRET) {
                document.getElementById('auth-code').innerText = "無密鑰";
                document.getElementById('title-text').innerText = "請在網址後加上您的密鑰";
                return;
            }
            document.getElementById('title-text').innerText = "當前驗證碼為";
            const token = TOTP.getOTP(SECRET);
            if (token === "ERROR") {
                document.getElementById('auth-code').innerText = "ERROR";
                document.getElementById('title-text').innerText = "密鑰格式不正確";
            } else {
                document.getElementById('auth-code').innerText = token.slice(0, 3) + " " + token.slice(3);
            }
        }

        function updateCountdown() {
            const epoch = Math.round(new Date().getTime() / 1000);
            const remaining = 30 - (epoch % 30);
            document.getElementById('countdown-text').innerText = "倒計時 " + remaining + "s";
            if (remaining === 30 || document.getElementById('auth-code').innerText === "------" || document.getElementById('auth-code').innerText === "無密鑰") {
                updateTOTP();
            }
        }

        function copyCode() {
            const code = document.getElementById('auth-code').innerText.replace(" ", "");
            if (code === "------" || code === "ERROR" || code === "無密鑰") return;
            navigator.clipboard.writeText(code).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 1500);
            });
        }

        window.addEventListener('hashchange', () => {
            SECRET = getSecret();
            updateTOTP();
        });

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
